name: framestation

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: framestation
      POSTGRES_DB: framestation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Plumbing, not media. Lives beside the other containers' data rather
      # than in the media share — a filesystem snapshot of a *live* Postgres
      # is a database that needs crash recovery, not a backup, and it must not
      # share a snapshot policy with photos.
      - ${FRAMESTATION_DATA:-/volume1/docker/framestation}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framestation -d framestation"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    # Built by CI for linux/amd64 and pulled on the NAS:
    #   docker compose pull && docker compose up -d
    # The NAS then needs only this file and .env — no source checkout, no
    # 20–45 minute Swift build on a J4125.
    image: ${FRAMESTATION_IMAGE:-ghcr.io/michaelromero212/framestation-server:latest}
    build:
      # Only used by `docker compose build` from a source checkout. Repo root,
      # because the server depends on ../Packages/FrameStationAPI by path.
      context: .
      dockerfile: Server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FRAMESTATION_DATABASE_URL: postgres://framestation:${POSTGRES_PASSWORD}@db:5432/framestation?sslmode=disable
      FRAMESTATION_BLOB_ROOT: /data
      # DSM's own auth API, for signing in with a Synology account. Reached on
      # the host, never over the internet. Uses plain HTTP on 5000 deliberately:
      # the request never leaves the NAS, and DSM's 5001 certificate is
      # self-signed for the LAN address.
      FRAMESTATION_DSM_URL: ${FRAMESTATION_DSM_URL:-http://host.docker.internal:5000}
      FRAMESTATION_HOMES_ROOT: /homes
      # The blob store and the homes again, as they appear inside the one mount
      # of the whole volume below. A clone between them (every File Station
      # copy, and every file the import brings in) goes through these paths,
      # because DSM's kernel refuses a clone between two separately mounted
      # folders even on one volume, and /data and /homes are two. Before these
      # existed, every File Station copy on the NAS was an empty file (found
      # in October 2026). Everything else uses /data and /homes.
      FRAMESTATION_CLONE_BLOB_ROOT: ${FRAMESTATION_DATA:-/volume1/docker/framestation}
      FRAMESTATION_CLONE_HOMES_ROOT: ${FRAMESTATION_HOMES:-/volume1/homes}
      # The §3a layout: photos are written to a real path a person can open in
      # File Station, and that file is the photo. Off, this runs the old
      # content-addressed model — storage_path stays NULL, every file is named
      # by hash, and `rebuild` has nothing to read.
      FRAMESTATION_BROWSE_TREE: ${FRAMESTATION_BROWSE_TREE:-1}
      # The media share itself, mounted at /shared, so someone opening it in
      # File Station sees shared libraries and nothing else. Left unset the code
      # falls back to /volume1/FrameStation/Shared, which exists on the NAS and
      # not in here — every shared-space placement would fail on a path that
      # looks right in the logs.
      FRAMESTATION_SHARED_ROOT: /shared
      # Push: activity banners, and the silent push that wakes a phone whose
      # backup iOS has paused overnight. Off until Apple's key is here — drop
      # the downloaded AuthKey_<KEY ID>.p8 into the secrets/ folder beside
      # pgdata and restart. The key ID comes from the file's name and the team
      # and topic default to this app's, so these stay blank unless overriding.
      # Blank reaches the server as unset.
      FRAMESTATION_APNS_KEY_ID: ${FRAMESTATION_APNS_KEY_ID:-}
      FRAMESTATION_APNS_TEAM_ID: ${FRAMESTATION_APNS_TEAM_ID:-}
      FRAMESTATION_APNS_TOPIC: ${FRAMESTATION_APNS_TOPIC:-}
      FRAMESTATION_APNS_KEY_PATH: ${FRAMESTATION_APNS_KEY_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The analyzer beside this container (NAS-ANALYSIS.md). Unset, the server
      # doesn't analyze; with the analyzer stopped or missing, it carries on and
      # waits for it.
      FRAMESTATION_ANALYZER_SOCKET: /run/framestation-analyzer/analyzer.sock
      # People: several looks per person, and unnamed groups folded into the
      # people someone named (NAS-ANALYSIS.md §7). Set to 0 in .env and
      # grouping is as it was before looks. Run `analysis people-matches`
      # first to see what it would do.
      FRAMESTATION_PEOPLE_LOOKS: ${FRAMESTATION_PEOPLE_LOOKS:-1}
    # Root, because the layout above writes into each person's DSM home and
    # hands the file to them with chown — both of which a non-root container
    # cannot do. The image itself runs as vapor:vapor and is happy to; this
    # overrides it only because /volume1/homes demands it.
    #
    # The port is loopback-only behind DSM's reverse proxy. What's mounted is
    # wider than it was: the whole volume, so clones work (see below), which
    # means this root container can reach every shared folder, not only the
    # app's own folder and the homes. That was the price of File Station copies
    # that aren't empty or full duplicates.
    # Set FRAMESTATION_USER=vapor:vapor to decline — uploads still work, they
    # just stay in the blob store and never reach anyone's home directory.
    user: ${FRAMESTATION_USER:-0:0}
    extra_hosts:
      # Lets the container resolve the NAS itself. If your DSM version doesn't
      # support host-gateway, set FRAMESTATION_DSM_URL to the NAS's LAN IP.
      - "host.docker.internal:host-gateway"
    volumes:
      # Plumbing: the blob store, chunk staging and regenerable derivatives.
      # Deliberately not the media share — these want a different snapshot
      # policy to photos, and a person browsing their library should not have
      # to scroll past blobs/ab/cd/ to find it.
      - ${FRAMESTATION_DATA:-/volume1/docker/framestation}:/data
      # Media: shared-space libraries, and nothing else.
      - ${FRAMESTATION_MEDIA:-/volume1/FrameStation}:/shared
      # User home directories, so each person's photos land in their own
      # DSM-private tree. Reflinked from the blob store, so near-zero extra
      # space — hardlinks can't be used because Synology makes every shared
      # folder its own Btrfs subvolume.
      - ${FRAMESTATION_HOMES:-/volume1/homes}:/homes
      # The whole volume, once, at its own path. A clone between two of the
      # mounts above fails, so clones go through this one instead (see
      # FRAMESTATION_CLONE_*). It also lets the import read a Synology library
      # where it lies: `import --path /volume1/photo`.
      - ${FRAMESTATION_VOLUME:-/volume1}:${FRAMESTATION_VOLUME:-/volume1}
      # The analyzer's socket: the only way into that container.
      - analyzer-run:/run/framestation-analyzer
    ports:
      # Loopback only. DSM's reverse proxy is the sole entry point, so the
      # container is never directly reachable from the LAN or the internet.
      - "127.0.0.1:8080:8080"

  analyzer:
    # What the NAS sees in photos and videos: pinned open models (SigLIP 2,
    # YuNet, SFace), checked by hash at every start. See NAS-ANALYSIS.md.
    # Built by CI for linux/amd64 and pulled like the server.
    image: ${FRAMESTATION_ANALYZER_IMAGE:-ghcr.io/michaelromero212/framestation-analyzer:latest}
    build:
      context: .
      dockerfile: Analyzer/Dockerfile
    restart: unless-stopped
    # No network at all: not the internet, not the LAN, not the database, not
    # the server's port. The socket in analyzer-run is the one way in, and
    # nothing this container reads can leave it except as numbers the server
    # checks.
    network_mode: none
    # Root, as for the server, because each DSM home is private to its person,
    # but with every capability dropped except the two that read files, no way
    # to gain more, and a read-only root filesystem. Every media mount is
    # read-only too, so nothing here can change a photo.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Measured at 1.2 GB on the NAS; a runaway file is stopped here rather
    # than taking memory from the server and Postgres.
    mem_limit: 2g
    environment:
      ANALYZER_THREADS: ${FRAMESTATION_ANALYZER_THREADS:-2}
      # Where the server's paths point, mounted at the same places. A path
      # anywhere else is refused.
      ANALYZER_ROOTS: /homes:/shared:/data/blobs
    volumes:
      - analyzer-run:/run/framestation-analyzer
      - ${FRAMESTATION_HOMES:-/volume1/homes}:/homes:ro
      - ${FRAMESTATION_MEDIA:-/volume1/FrameStation}:/shared:ro
      # The blob store only: not secrets/, .env or pgdata beside it.
      - ${FRAMESTATION_DATA:-/volume1/docker/framestation}/blobs:/data/blobs:ro

volumes:
  # A Docker volume, so there's no folder to create on the NAS first.
  analyzer-run:
