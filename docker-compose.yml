name: framestation

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: framestation
      POSTGRES_DB: framestation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${FRAMESTATION_ROOT:-/volume1/framestation}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framestation -d framestation"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    # Built by CI for linux/amd64 and pulled on the NAS:
    #   docker compose pull && docker compose up -d
    # The NAS then needs only this file and .env — no source checkout, no
    # 20–45 minute Swift build on a J4125.
    image: ${FRAMESTATION_IMAGE:-ghcr.io/michaelromero212/synology-photos-station:latest}
    build:
      # Only used by `docker compose build` from a source checkout. Repo root,
      # because the server depends on ../Packages/FrameStationAPI by path.
      context: .
      dockerfile: Server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FRAMESTATION_DATABASE_URL: postgres://framestation:${POSTGRES_PASSWORD}@db:5432/framestation?sslmode=disable
      FRAMESTATION_BLOB_ROOT: /data
      # DSM's own auth API, for signing in with a Synology account. Reached on
      # the host, never over the internet. Uses plain HTTP on 5000 deliberately:
      # the request never leaves the NAS, and DSM's 5001 certificate is
      # self-signed for the LAN address.
      FRAMESTATION_DSM_URL: ${FRAMESTATION_DSM_URL:-http://host.docker.internal:5000}
      FRAMESTATION_HOMES_ROOT: /homes
      # The §3a layout: photos are written to a real path a person can open in
      # File Station, and that file is the photo. Off, this runs the old
      # content-addressed model — storage_path stays NULL, every file is named
      # by hash, and `rebuild` has nothing to read.
      FRAMESTATION_BROWSE_TREE: ${FRAMESTATION_BROWSE_TREE:-1}
      # Inside the container, not on the host: /volume1/framestation is mounted
      # at /data. Left unset the code falls back to /volume1/FrameStation/Shared,
      # which exists on the NAS and not in here — every shared-space placement
      # would fail on a path that looks right in the logs.
      FRAMESTATION_SHARED_ROOT: /data/Shared
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Root, because the layout above writes into each person's DSM home and
    # hands the file to them with chown — both of which a non-root container
    # cannot do. The image itself runs as vapor:vapor and is happy to; this
    # overrides it only because /volume1/homes demands it.
    #
    # The exposure is bounded: the port is loopback-only behind DSM's reverse
    # proxy, and the only paths mounted are the app's own volume and homes.
    # Set FRAMESTATION_USER=vapor:vapor to decline — uploads still work, they
    # just stay in the blob store and never reach anyone's home directory.
    user: ${FRAMESTATION_USER:-0:0}
    extra_hosts:
      # Lets the container resolve the NAS itself. If your DSM version doesn't
      # support host-gateway, set FRAMESTATION_DSM_URL to the NAS's LAN IP.
      - "host.docker.internal:host-gateway"
    volumes:
      - ${FRAMESTATION_ROOT:-/volume1/framestation}:/data
      # User home directories, so each person's photos land in their own
      # DSM-private tree. Reflinked from the blob store, so near-zero extra
      # space — hardlinks can't be used because Synology makes every shared
      # folder its own Btrfs subvolume.
      - ${FRAMESTATION_HOMES:-/volume1/homes}:/homes
    ports:
      # Loopback only. DSM's reverse proxy is the sole entry point, so the
      # container is never directly reachable from the LAN or the internet.
      - "127.0.0.1:8080:8080"
