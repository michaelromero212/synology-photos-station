name: FrameStation
options:
  bundleIdPrefix: com.michaelromero
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true

packages:
  # Local paths, not versioned URLs — these live in this repo alongside the
  # server, which is the point: the server imports FrameStationAPI too, so an
  # API change breaks both builds at once instead of at runtime.
  FrameStationAPI:
    path: Packages/FrameStationAPI
  FrameStationKit:
    path: Packages/FrameStationKit

configs:
  Debug: debug
  Release: release

settings:
  configs:
    Debug:
      # XcodeGen does NOT add this the way Xcode's own project template does,
      # so without it `#if DEBUG` is false in every configuration — debug-only
      # code silently compiles out and print guards silently stay in.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
  base:
    SWIFT_VERSION: "5.9"
    # SOURCE OF TRUTH for version + build. XcodeGen overwrites Xcode's General
    # tab on every `xcodegen generate`, so ALWAYS set these here, not in Xcode.
    #
    # These only became the source of truth when each target's Info.plist was
    # pointed at them. XcodeGen writes its own defaults — 1.0 and 1, as
    # literals — into any plist that doesn't say otherwise, so for a while this
    # said 0.1 while every build came out 1.0 and nothing reported the
    # disagreement. That is a quiet way to lose an afternoon to TestFlight:
    # App Store Connect refuses a build number it has already seen, and bumping
    # the number here would have changed nothing at all.
    MARKETING_VERSION: "1.0"
    # Bumped for every upload. App Store Connect will not take the same build
    # number twice against one version, and the error it gives arrives after
    # the upload rather than before it.
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "47453G7Q89"
    CODE_SIGN_STYLE: Automatic
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Without this the AccentColor colorset is compiled into the catalog and
    # then ignored: `.tint` keeps resolving to system blue on iOS and to the
    # user's own accent on macOS, so the sign-in mark and the app icon end up
    # in different liveries.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  # ---------------------------------------------------------------------------
  # iOS — the only target that backs up. iPhone + iPad from one binary.
  # ---------------------------------------------------------------------------
  FrameStation-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/macOS/**"
          - "Resources/tvOS/**"
    info:
      path: App/Resources/iOS/Info.plist
      properties:
        # "FrameStation" in both configurations now. The Debug build is still a
        # separate app — see its own bundle id in the Debug config below — but it
        # is kept apart by identity, not by wearing a different name.
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # Pointed at the build settings rather than left to XcodeGen's literals
        # — see MARKETING_VERSION above for what that cost.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required at the top level of the built plist, and `actool` only wrote
        # it *nested* inside CFBundleIcons here — verified by reading the
        # archive. Declaring it is identical to what the catalog produces, so it
        # is free either way, and it is the difference between an upload that
        # goes through and ITMS-90713.
        CFBundleIconName: AppIcon
        # Pinned to the app's own background rather than left as `{}`.
        #
        # An empty launch screen follows the *device's* appearance, while the
        # app forces dark by default (Appearance.swift) — so a phone in light
        # mode showed a white launch screen cutting to a black app on every
        # cold start. Black here matches what the app draws next, and the
        # handoff stops being visible.
        #
        # The trade: someone who deliberately sets Appearance to Light gets a
        # brief dark frame instead. That's a minority choice, and a far smaller
        # flash than the one it replaces.
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        # Full library access. Limited access silently breaks backup — the app
        # detects it and says so rather than backing up twelve photos.
        NSPhotoLibraryUsageDescription: FrameStation backs up your photos and videos to your family's NAS, and shows the ones already stored there.
        NSPhotoLibraryAddUsageDescription: FrameStation saves photos from your family library back to this device.
        NSLocalNetworkUsageDescription: FrameStation connects to your NAS over your home network for full-speed backup and browsing.
        NSBonjourServices:
          - _framestation._tcp
        # Without this the app cannot talk to a NAS over plain HTTP, and the
        # sign-in screen offers an HTTPS toggle precisely because plain HTTP is
        # a supported way to run this.
        #
        # App Transport Security blocks cleartext to an IP literal by default,
        # and it blocks it *before* the request reaches the network — so the
        # failure arrives as a transport error, is classified `.unreachable`,
        # and the grid tells the user their NAS isn't responding when in fact
        # iOS never let us ask it. Turning the toggle off produced a permanently
        # broken connection blamed on the box in the basement.
        #
        # `NSAllowsLocalNetworking` and not `NSAllowsArbitraryLoads`: this
        # exempts link-local addresses, `.local` names and unqualified hosts —
        # exactly the addresses a NAS on your own network has — while leaving
        # cleartext to the public internet blocked. It also needs no App Review
        # justification, which the blanket key does.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # M5: background uploads survive termination only via a background
        # URLSession; BGTaskScheduler drives the catch-up scans.
        UIBackgroundModes:
          - fetch
          - processing
          # M6: lets a silent push wake the app; alert pushes don't need it,
          # but the activity payload may carry a badge refresh later.
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.michaelromero.FrameStation.backup
          - com.michaelromero.FrameStation.refresh
        # iPhone deliberately stops at three. Upside-down portrait is a
        # position nobody holds a phone in on purpose, and Apple's own apps
        # don't offer it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad has to declare all four. Split View and Slide Over can put this
        # app on either side of a screen the user has rotated any which way, so
        # opting into multitasking — which UIRequiresFullScreen: false does —
        # means committing to every orientation. Declaring three and claiming
        # multitasking is the contradiction Xcode is pointing at.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Kept false on purpose: the grid reflows into a narrow split-view
        # column, down to a phone's three across — see
        # PhotoGridMetrics.squareColumns.
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelromero.FrameStation
        APP_DISPLAY_NAME: FrameStation
        # iPhone + iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Resources/iOS/FrameStation.entitlements
      configs:
        # A Debug build is a different app from the one on your phone, and this
        # is the line that makes that true rather than merely intended.
        #
        # iOS scopes a Keychain item by access group, which defaults to
        # `$(AppIdentifierPrefix)$(CFBundleIdentifier)` — so a separate bundle
        # identifier means the test build cannot read, overwrite or sign out the
        # real app's session even when both are installed on the same iPhone. It
        # gets its own container, its own cached library and its own push topic
        # for free, along the same seam.
        #
        # The alternative was discipline: never install a debug build on the
        # real device. That works right up until the one time you need to test
        # something on real hardware, and by then the damage is a sign-in screen
        # where the family library used to be.
        #
        # Nothing else needed renaming. The BGTask identifiers are matched
        # against Info.plist rather than the bundle id, background URLSession
        # identifiers are already per-app, and the Keychain *service* string can
        # stay shared precisely because the access group is what separates them.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.michaelromero.FrameStation.dev
    dependencies:
      - package: FrameStationKit
        product: FrameStationKit

  # ---------------------------------------------------------------------------
  # macOS — upload, but no backup. No Photos library to sweep and nothing to
  # be suspended mid-transfer, so it gets the file picker and drag-and-drop
  # and neither automatic backup nor Focused Backup.
  # ---------------------------------------------------------------------------
  FrameStation-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - "Resources/iOS/**"
          - "Resources/tvOS/**"
    info:
      path: App/Resources/macOS/Info.plist
      properties:
        CFBundleDisplayName: FrameStation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        # Required of every Mac App Store submission, and the rejection for
        # omitting it arrives after the upload rather than during it. There is
        # no ambiguity about which one this is.
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: © 2026 Michael Romero
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: FrameStation connects to your NAS over your home network to browse your family library.
        NSBonjourServices:
          - _framestation._tcp
    entitlements:
      path: App/Resources/macOS/FrameStation.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelromero.FrameStation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Required to notarise a direct download, which is the other way this
        # app could reach a Mac, and harmless on the App Store path — where the
        # sandbox above is the requirement. Off by default in a generated
        # project, and the failure arrives from the notary service long after
        # the build succeeded, which is a bad time to learn it.
        #
        # Nothing here needs an exception to it: no JIT, no unsigned executable
        # memory, no loading of plug-ins the app did not ship.
        ENABLE_HARDENED_RUNTIME: "YES"
    dependencies:
      - package: FrameStationKit
        product: FrameStationKit

  # ---------------------------------------------------------------------------
  # tvOS — view-only, 10-foot layout, slideshow.
  # ---------------------------------------------------------------------------
  FrameStation-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/iOS/**"
          - "Resources/macOS/**"
    info:
      path: App/Resources/tvOS/Info.plist
      properties:
        CFBundleDisplayName: FrameStation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: FrameStation connects to your NAS over your home network to browse your family library.
        NSBonjourServices:
          - _framestation._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelromero.FrameStation
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    dependencies:
      - package: FrameStationKit
        product: FrameStationKit
