name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The server has only ever been compiled on macOS. It ships on Linux, where
  # Foundation is a different implementation — Process, FileHandle callbacks,
  # and FileManager attributes all diverge. This job is the only thing standing
  # between a green local build and a container that won't compile.
  server-linux:
    name: Server (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Server/.build
          key: spm-linux-${{ hashFiles('Server/Package.resolved') }}
          restore-keys: spm-linux-

      # Debug only. The `image` job's Dockerfile already does a release build,
      # so doing one here too roughly doubled the job for no extra signal —
      # a debug build catches Linux compile errors just as well, and failing
      # here short-circuits before the far more expensive image build starts.
      #
      # Tradeoff: pull requests skip the image job, so they get no release-mode
      # compile. Accepted — main always gets one.
      - name: Build
        run: swift build --package-path Server

  # FrameStationKit is Apple-only (Keychain, ImageIO), so its tests need macOS.
  # This also covers FrameStationAPI, including the ThumbHash round trips.
  kit-tests:
    name: FrameStationKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --package-path Packages/FrameStationKit

  apps:
    name: App targets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS / macOS / tvOS
        run: |
          set -euo pipefail
          # Signing is skipped: CI proves it compiles, not that it ships.
          for entry in "FrameStation-iOS|generic/platform=iOS Simulator" \
                       "FrameStation-macOS|platform=macOS" \
                       "FrameStation-tvOS|generic/platform=tvOS Simulator"; do
            scheme="${entry%%|*}"
            destination="${entry##*|}"
            echo "::group::$scheme"
            xcodebuild build \
              -project FrameStation.xcodeproj \
              -scheme "$scheme" \
              -destination "$destination" \
              CODE_SIGNING_ALLOWED=NO \
              -quiet
            echo "::endgroup::"
          done

  image:
    name: Container image
    needs: [server-linux, kit-tests]
    # Only publish from main and tags; PRs just prove the build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repository root: the server depends on ../Packages/FrameStationAPI
          # by path, so that sibling has to be inside the build context.
          context: .
          file: Server/Dockerfile
          # The DS920+ is an Intel Celeron J4125.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report what we just shipped. An image size that nobody measures only
      # ever goes one direction, and reading it off the registry manifest needs
      # no daemon, no pull, and no shell on the NAS.
      - name: Image size
        run: |
          set -euo pipefail
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)"
          repo="${ref%:*}"

          # buildx publishes an OCI *index* (the image plus provenance and SBOM
          # attestations), so the top level has no layers — resolve to the real
          # linux/amd64 manifest first.
          docker buildx imagetools inspect "$ref" --raw > /tmp/index.json
          digest=$(python3 -c '
          import json
          index = json.load(open("/tmp/index.json"))
          if "layers" in index:
              print("")
          else:
              for entry in index.get("manifests", []):
                  platform = entry.get("platform", {})
                  if platform.get("architecture") == "amd64" and platform.get("os") == "linux":
                      print(entry["digest"]); break
          ')

          if [ -n "$digest" ]; then
            docker buildx imagetools inspect "$repo@$digest" --raw > /tmp/manifest.json
          else
            cp /tmp/index.json /tmp/manifest.json
          fi

          python3 - "$ref" <<'REPORT' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          manifest = json.load(open("/tmp/manifest.json"))
          layers = manifest.get("layers", [])
          total = sum(layer["size"] for layer in layers)
          print("### Container image\n")
          print(f"`{sys.argv[1]}`\n")
          print(f"**{total / 1e6:.0f} MB compressed** across {len(layers)} layers.\n")
          print("| Layer | Compressed |")
          print("|-------|-----------|")
          for index, layer in enumerate(sorted(layers, key=lambda l: -l["size"]), 1):
              print(f"| {index} | {layer['size'] / 1e6:.1f} MB |")
          REPORT
