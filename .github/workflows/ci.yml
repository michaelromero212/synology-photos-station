name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Named for the app, not the repository. `${{ github.repository }}` would
  # publish `synology-photos-station` — the repo's original name, from before
  # this stopped being a wrapper around Synology Photos and became FrameStation.
  # Set explicitly so the package matches the app and sits beside
  # `reelstation-server` in the registry rather than reading like a different
  # project.
  IMAGE_NAME: ${{ github.repository_owner }}/framestation-server

jobs:
  # The server has only ever been compiled on macOS. It ships on Linux, where
  # Foundation is a different implementation — Process, FileHandle callbacks,
  # and FileManager attributes all diverge. This job is the only thing standing
  # between a green local build and a container that won't compile.
  server-linux:
    name: Server (Linux)
    runs-on: ubuntu-latest
    # The same toolchain as .swift-version and the Dockerfile's SWIFT_VERSION.
    # The first step fails the job when the three disagree.
    container: swift:6.4.0-jammy
    # Inside a container GitHub runs steps with plain `sh`, which has no
    # `pipefail`; the Swift image has bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Toolchains agree
        run: |
          set -euo pipefail
          # A .0 release calls itself "6.4" while its tags and swiftly say
          # "6.4.0"; compare them as the same version.
          norm() { sed -E 's/^([0-9]+[.][0-9]+)[.]0$/\1/' <<<"$1"; }
          pinned="$(cat .swift-version)"
          container="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -n 1)"
          image="$(sed -n 's/^ARG SWIFT_VERSION=//p' Server/Dockerfile)"
          echo ".swift-version: $pinned · this job: $container · Server/Dockerfile: $image"
          if [ "$(norm "$container")" != "$(norm "$pinned")" ] || [ "$(norm "$image")" != "$(norm "$pinned")" ]; then
            echo "::error::Swift versions disagree. .swift-version says $pinned, this job runs $container, and Server/Dockerfile builds with $image. Change all three together."
            exit 1
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: Server/.build
          # The toolchain is part of the key: one Swift's build products are no
          # use to another, and restoring them only slows the build down.
          key: spm-linux-${{ hashFiles('.swift-version') }}-${{ hashFiles('Server/Package.resolved') }}
          restore-keys: spm-linux-${{ hashFiles('.swift-version') }}-

      # Debug only. The `image` job's Dockerfile already does a release build,
      # so doing one here too roughly doubled the job for no extra signal —
      # a debug build catches Linux compile errors just as well, and failing
      # here short-circuits before the far more expensive image build starts.
      #
      # Exactly the pinned versions, or fail. Without the flag SwiftPM quietly
      # re-resolves any pin the toolchain can't use, and the build goes green
      # on dependencies nobody chose.
      - name: Build
        run: swift build --package-path Server --force-resolved-versions

  # FrameStationKit is Apple-only (Keychain, ImageIO), so its tests need macOS.
  # This also covers FrameStationAPI, including the ThumbHash round trips.
  kit-tests:
    name: FrameStationKit tests
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: ls -d /Applications/Xcode*.app && xcodebuild -version && swift --version
      - name: Run tests
        run: swift test --package-path Packages/FrameStationKit

  # Built with the Xcode the apps are developed with, chosen by path rather
  # than left to the runner's default: a CI on an older SDK than the Mac never
  # compiles the newest code paths, and one that follows the runner's default
  # changes Xcode on GitHub's schedule instead of ours. Move this, the
  # kit-tests job and the Mac together. `xcode-27` is GitHub's Xcode 27 image,
  # in public preview; move to its macos-27 label when that is generally
  # available.
  apps:
    name: App targets
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: ls -d /Applications/Xcode*.app && xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS / macOS / tvOS
        run: |
          set -euo pipefail
          # Signing is skipped: CI proves it compiles, not that it ships.
          for entry in "FrameStation-iOS|generic/platform=iOS Simulator" \
                       "FrameStation-macOS|platform=macOS" \
                       "FrameStation-tvOS|generic/platform=tvOS Simulator"; do
            scheme="${entry%%|*}"
            destination="${entry##*|}"
            echo "::group::$scheme"
            xcodebuild build \
              -project FrameStation.xcodeproj \
              -scheme "$scheme" \
              -destination "$destination" \
              CODE_SIGNING_ALLOWED=NO \
              -quiet
            echo "::endgroup::"
          done

  # Every run builds the image and starts it; only main and release tags
  # publish it. The NAS pulls :latest, so nothing reaches it that hasn't
  # migrated a real database, answered /health and taken an upload first.
  image:
    name: Container image
    needs: [server-linux, kit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          # Repository root: the server depends on ../Packages/FrameStationAPI
          # by path, so that sibling has to be inside the build context.
          context: .
          file: Server/Dockerfile
          # The DS920+ is an Intel Celeron J4125.
          platforms: linux/amd64
          load: true
          tags: framestation-server:ci
          labels: ${{ steps.meta.outputs.labels }}
          # Reported by /health, so the NAS can say which commit it runs.
          build-args: FRAMESTATION_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: Scripts/smoke-image.sh framestation-server:ci "${{ github.sha }}"

      # The same build again, answered entirely from the cache the step above
      # just filled, so what is pushed is what was tested.
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FRAMESTATION_REVISION=${{ github.sha }}
          cache-from: type=gha

      # Report what we just shipped. An image size that nobody measures only
      # ever goes one direction, and reading it off the registry manifest needs
      # no daemon, no pull, and no shell on the NAS.
      - name: Image size
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)"
          repo="${ref%:*}"

          # buildx publishes an OCI *index* (the image plus provenance and SBOM
          # attestations), so the top level has no layers — resolve to the real
          # linux/amd64 manifest first.
          docker buildx imagetools inspect "$ref" --raw > /tmp/index.json
          digest=$(python3 -c '
          import json
          index = json.load(open("/tmp/index.json"))
          if "layers" in index:
              print("")
          else:
              for entry in index.get("manifests", []):
                  platform = entry.get("platform", {})
                  if platform.get("architecture") == "amd64" and platform.get("os") == "linux":
                      print(entry["digest"]); break
          ')

          if [ -n "$digest" ]; then
            docker buildx imagetools inspect "$repo@$digest" --raw > /tmp/manifest.json
          else
            cp /tmp/index.json /tmp/manifest.json
          fi

          python3 - "$ref" <<'REPORT' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          manifest = json.load(open("/tmp/manifest.json"))
          layers = manifest.get("layers", [])
          total = sum(layer["size"] for layer in layers)
          print("### Container image\n")
          print(f"`{sys.argv[1]}`\n")
          print(f"**{total / 1e6:.0f} MB compressed** across {len(layers)} layers.\n")
          print("| Layer | Compressed |")
          print("|-------|-----------|")
          for index, layer in enumerate(sorted(layers, key=lambda l: -l["size"]), 1):
              print(f"| {index} | {layer['size'] / 1e6:.1f} MB |")
          REPORT
