# The App Review server's only way in.
#
# The server and its database sit on a Docker network with no way out (see
# docker-compose.yml), and Docker won't publish a port from such a network. So
# this sits on it too, and passes along whatever DSM's reverse proxy sends to
# 127.0.0.1:8081 to the server's 8080. It works on the connection, not on HTTP:
# it never reads what passes through, and it forwards to nothing else.
user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

stream {
    # Docker's own name server, looked up per connection, so a server that was
    # recreated with a new address is found again without restarting this.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        set $demo server:8080;
        proxy_pass $demo;
        # Uploads and video streams hold a connection open for a long time.
        proxy_timeout 1h;
    }
}
