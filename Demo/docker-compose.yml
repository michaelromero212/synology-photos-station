# A second FrameStation for App Review: sample photos only, its own database,
# its own folder, its own address. Nothing in it can reach the family's server,
# and nothing in it can reach anything else either: not DSM, not another folder
# on the NAS, not the LAN, not the internet.
#
# Lives in its own folder on the NAS, beside the real one rather than inside
# it, with its own .env:
#
#   /volume1/docker/framestation-demo/
#     docker-compose.yml        this file
#     edge.conf                 Demo/edge.conf, the one way in
#     .env                      POSTGRES_PASSWORD=<a new one, not the family's>
#     demo-setup.sh             Scripts/demo-setup.sh
#     demo-isolation-check.sh   Scripts/demo-isolation-check.sh
#     seed/                     the sample photos
#
# APP-REVIEW.md walks through it.
name: framestation-demo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: framestation
      POSTGRES_DB: framestation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${FRAMESTATION_DEMO_DATA:-/volume1/docker/framestation-demo}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framestation -d framestation"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [demo]
    security_opt: ["no-new-privileges:true"]

  server:
    # The same image the family's server runs, so a reviewer sees the build
    # that ships. Pulled, never built here.
    image: ${FRAMESTATION_IMAGE:-ghcr.io/michaelromero212/framestation-server:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FRAMESTATION_DATABASE_URL: postgres://framestation:${POSTGRES_PASSWORD}@db:5432/framestation?sslmode=disable
      FRAMESTATION_BLOB_ROOT: /data
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Deliberately absent, each one:
      #
      #   FRAMESTATION_DSM_URL  No DSM sign-in. The family's server checks DSM
      #                         passwords; this one, open to whoever has the
      #                         review code, must never be a way to try them.
      #                         Unset, DSM sign-in answers that it isn't
      #                         configured.
      #   FRAMESTATION_BROWSE_TREE
      #                         Off: photos stay in this server's own folder
      #                         and never reach anyone's home or File Station.
      #   FRAMESTATION_APNS_*   No push. The inbox still shows what was added.
    # The image's own unprivileged user, and nothing mounted but this server's
    # folders. The family's server runs as root because it writes into DSM
    # homes; this one has no reason to.
    user: vapor:vapor
    volumes:
      - ${FRAMESTATION_DEMO_DATA:-/volume1/docker/framestation-demo}/data:/data
      # The sample photos, for `import`. Read-only: setup copies them in.
      - ${FRAMESTATION_DEMO_DATA:-/volume1/docker/framestation-demo}/seed:/seed:ro
    # No ports: `edge` is the only way in. And on the `demo` network alone,
    # it has no way out, so even a reviewer who broke into the server itself
    # would find nothing to reach but its own database.
    networks: [demo]
    security_opt: ["no-new-privileges:true"]

  edge:
    # Passes the server's one port through to DSM's reverse proxy, byte for
    # byte, and does nothing else. It exists because Docker won't publish a
    # port from a network with no way out; edge.conf says more.
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [server]
    volumes:
      - ${FRAMESTATION_DEMO_DATA:-/volume1/docker/framestation-demo}/edge.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Loopback only, beside the family's 8080. DSM's reverse proxy gives it
      # its own name on 8443 — see APP-REVIEW.md.
      - "127.0.0.1:8081:8080"
    networks: [demo, outside]
    security_opt: ["no-new-privileges:true"]

networks:
  # Internal: no route to the NAS, its other containers, the LAN or the
  # internet. Only the database, the server and edge are on it.
  demo:
    internal: true
  # Only for edge, so Docker can publish its port on the NAS's loopback.
  outside: {}
